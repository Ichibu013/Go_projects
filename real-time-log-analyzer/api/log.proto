syntax = "proto3";

option go_package = "real-time-log-analyzer/api";

package log;

message  LogEntry {
  string service_name = 1;
  string level = 2;
  string message = 3;
  int64 timestamp = 4;
}

message Ack {
  bool success = 1;
  string error_msg = 2;
}

service LogService {
  rpc IngestLog (LogEntry) returns (Ack);
}